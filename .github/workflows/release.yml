name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must match package.json version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ] && [ "$TAG" != "$expected" ]; then
            echo "Release tag $TAG does not match package.json version $expected" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build installers
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset empty signing variables so unsigned builds work without secrets.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --publish never --arm64 --x64
          else
            npx electron-builder --publish never
          fi
      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.deb dist/*.exe dist/*.dmg dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were built" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
